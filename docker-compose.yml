# Local development database. Credentials here are for local use only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rmn
      POSTGRES_PASSWORD: rmn
      POSTGRES_DB: rmn_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
