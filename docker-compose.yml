# Local development stack. Credentials here are for local use only.
#   docker compose up -d postgres                     database only (default)
#   docker compose --profile worker up -d             + isolated media worker (needs a .env, see .env.example)
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: rmn
      POSTGRES_PASSWORD: rmn
      POSTGRES_DB: rmn_dev
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [default, backend]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rmn"], interval: 3s, timeout: 3s, retries: 20 }

  # Parses untrusted uploads with ffmpeg, so it gets as little as possible (R-023):
  # no internet (database-only internal network), read-only root filesystem, non-root user, no Linux capabilities,
  # no privilege escalation, and memory/CPU/process limits. Only the media directory and /tmp are writable.
  media-worker:
    profiles: ["worker"]
    image: ${MEDIA_WORKER_IMAGE:-rmn-media-worker}
    build:
      context: .
      dockerfile: infra/media-worker/Dockerfile
      args: { BASE: "${NODE_IMAGE:-node:22-bookworm-slim}" }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rmn:rmn@postgres:5432/${MEDIA_DB:-rmn_dev}
      MEDIA_ROOT: /media
      NODE_ENV: development
    volumes: ["${MEDIA_HOST_DIR:-./var/media}:/media"]
    networks: [backend]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777"]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped

networks:
  backend:
    internal: true   # no route to the internet

volumes:
  pgdata:
