name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    # The repository is public: fail fast if anything shaped like a real secret is committed (infra/secret-scan.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node infra/secret-scan.mjs --self-test
      - run: node infra/secret-scan.mjs
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rmn, POSTGRES_PASSWORD: rmn, POSTGRES_DB: rmn_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rmn:rmn@localhost:5432/rmn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: S3-compatible test server (moto) for media storage/backup tests
        run: |
          python3 -m pip install --quiet "moto[server]"
          nohup moto_server -H 127.0.0.1 -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5055/ && break; sleep 1; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { REQUIRE_S3_TESTS: "true" }
      - run: npm audit --omit=dev --audit-level=high
  player-e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rmn, POSTGRES_PASSWORD: rmn, POSTGRES_DB: rmn_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmn" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run e2e  # tablet player ride + rider phone app
  android-shell:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); android-actions/setup-android@v3 started failing
      # in its sdkmanager step on the current runner image, so the preinstalled SDK is used directly.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls "$ANDROID_HOME/platforms" | tail -3
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with: { name: tablet-shell-debug-apk, path: apps/android/app/build/outputs/apk/debug/*.apk, if-no-files-found: error }
  media-worker-isolation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client
      - run: npm ci
      - run: docker build -f infra/media-worker/Dockerfile -t rmn-media-worker .
      - run: bash infra/media-worker/verify.sh   # real upload processed in the hardened container + isolation checks
  load-test:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rmn, POSTGRES_PASSWORD: rmn, POSTGRES_DB: rmn_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmn" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: TABLETS=300 DURATION_S=45 npm run load:tablets -w @rmn/api   # fails on any error response; prints latency percentiles
