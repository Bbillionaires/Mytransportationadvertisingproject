<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMN Admin Console</title>
<style>
  :root { --bg:#f6f7f9; --fg:#14171a; --muted:#5b6670; --card:#fff; --line:#dde2e7; --accent:#1f5fbf; --bad:#b3261e; --ok:#1d7a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111417; --fg:#e8ecef; --muted:#9aa5ae; --card:#1a1f24; --line:#2c343b; --accent:#7fb0ff; --bad:#ff8a80; --ok:#7fd69b; } }
  * { box-sizing: border-box; } body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; } .tag { font-size:12px; color:var(--muted); }
  nav button, button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  nav button.active { border-color:var(--accent); color:var(--accent); }
  main { padding:16px; max-width:1100px; margin:auto; } .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  input { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; } .err { color:var(--bad); } .ok { color:var(--ok); }
</style>
</head>
<body>
<header><h1>Rideshare Media Network · Admin</h1><span class="tag">Phase 1 shell — server enforces every permission</span>
  <nav id="nav" hidden><button data-v="me">Me</button> <button data-v="orgs">Organizations</button> <button data-v="tb">Trial balance</button> <button data-v="rules">Revenue rules</button> <button data-v="audit">Audit log</button> <button data-v="campaigns">Campaigns</button> <button data-v="review">Review queue</button> <button id="logout">Sign out</button></nav>
</header>
<main>
  <section class="card" id="login">
    <h2>Sign in</h2>
    <form id="lf"><input id="email" type="email" placeholder="email" required autocomplete="username"> <input id="pw" type="password" placeholder="password" required autocomplete="current-password"> <button>Sign in</button></form>
    <form id="mf" hidden><p>Enter your authenticator code to unlock finance and platform actions.</p><input id="code" inputmode="numeric" pattern="\d{6}" placeholder="123456"> <button>Verify</button></form>
    <p id="lmsg" class="err"></p>
  </section>
  <section class="card" id="view" hidden></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let token = sessionStorage.getItem('rmn_token');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cents = (v) => { const n = BigInt(v); const neg = n < 0n; const a = (neg ? -n : n).toString().padStart(3, '0'); return (neg ? '-' : '') + a.slice(0, -2) + '.' + a.slice(-2); };
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error ? `${j.error.code}: ${j.error.message}` : r.statusText);
  return j;
}
function table(rows, cols) {
  if (!rows.length) return '<p class="tag">No rows.</p>';
  return '<table><thead><tr>' + cols.map((c) => `<th>${esc(c[0])}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + cols.map((c) => `<td class="${c[2] ? 'num' : ''}">${esc(c[2] ? c[2](r[c[1]]) : r[c[1]])}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
}
const views = {
  async me() { const m = await api('/v1/me'); return `<h2>${esc(m.user.displayName)}</h2><p>MFA: ${m.user.mfaEnabled ? (m.session.mfaVerified ? '<span class="ok">verified this session</span>' : 'enabled, not verified') : '<span class="err">not enrolled</span>'}</p>` + table(m.memberships, [['Org', 'orgId'], ['Kind', 'orgKind'], ['Role', 'role']]); },
  async orgs() { const o = await api('/v1/orgs'); return '<h2>Organizations</h2>' + table(o.items, [['Name', 'name'], ['Kind', 'kind'], ['Status', 'status'], ['ID', 'id']]); },
  async tb() { const t = await api('/v1/finance/trial-balance'); return `<h2>Trial balance <span class="${t.balanced ? 'ok' : 'err'}">${t.balanced ? 'balanced' : 'UNBALANCED'}</span></h2>` + table(t.rows, [['Account', 'accountCode'], ['Name', 'name'], ['CCY', 'currency'], ['Debit', 'debit', cents], ['Credit', 'credit', cents], ['Balance', 'balance', cents]]); },
  async rules() { const r = await api('/v1/finance/revenue-rules'); return '<h2>Revenue split rules</h2>' + table(r.items, [['Category', 'category'], ['v', 'version'], ['Driver bps', 'driver_bps'], ['Creator bps', 'creator_bps'], ['Platform bps', 'platform_bps'], ['From', 'effective_from'], ['To', 'effective_to'], ['Status', 'status']]); },
  async campaigns() {
    const m = await api('/v1/me');
    const advs = m.memberships.filter((x) => x.orgKind === 'ADVERTISER');
    if (!advs.length) return '<h2>Campaigns</h2><p class="tag">Campaigns are shown to advertiser accounts.</p>';
    let out = '';
    for (const a of advs) {
      const [c, b] = await Promise.all([api(`/v1/orgs/${a.orgId}/campaigns`), api(`/v1/orgs/${a.orgId}/balance`)]);
      const usd = (b.balances.USD || { prepaidBalance: '0' }).prepaidBalance;
      out += `<h2>Campaigns</h2><p>Prepaid balance (USD): <strong>${esc(cents(usd))}</strong></p>` + table(c.items.map((x) => ({ ...x, rate: x.rateMinor, sched: `${x.schedule.timezone} ${x.schedule.startMinute}-${x.schedule.endMinute}` })),
        [['Name', 'name'], ['Status', 'status'], ['Category', 'category'], ['Pricing', 'pricingModel'], ['Rate', 'rate', cents], ['Starts', 'startsAt'], ['Ends', 'endsAt'], ['Schedule', 'sched'], ['Review note', 'reviewNote']]);
    }
    return out;
  },
  async review() {
    const q = await api('/v1/review/campaigns');
    if (!q.campaigns.length) return '<h2>Review queue</h2><p class="tag">Nothing awaiting review.</p>';
    return '<h2>Review queue</h2>' + q.campaigns.map((c) => `<div class="card"><h3>${esc(c.name)} <span class="tag">${esc(c.advertiserName)} · ${esc(c.category)} · ${esc(c.destinationUrl || 'no destination')}</span></h3>` +
      table(c.creatives, [['Creative', 'name'], ['Kind', 'kind'], ['Headline', 'headline'], ['Media', 'mediaKey'], ['Status', 'status']]) +
      `<p><button data-approve="${esc(c.id)}">Approve campaign and all pending creatives</button> <button data-reject="${esc(c.id)}">Reject…</button></p></div>`).join('');
  },
  async audit() { const a = await api('/v1/audit?limit=100'); return '<h2>Audit log (latest 100)</h2>' + table(a.items, [['#', 'id'], ['When', 'occurred_at'], ['Action', 'action'], ['Target', 'target_type'], ['Target ID', 'target_id'], ['Actor', 'actor_user_id']]); },
};
async function show(v) {
  document.querySelectorAll('#nav button[data-v]').forEach((b) => b.classList.toggle('active', b.dataset.v === v));
  $('#view').hidden = false;
  try { $('#view').innerHTML = await views[v](); } catch (e) { $('#view').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
function signedIn() { $('#login').hidden = true; $('#nav').hidden = false; show('me'); }
$('#lf').onsubmit = async (e) => { e.preventDefault(); $('#lmsg').textContent = '';
  try { const r = await api('/v1/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) });
    token = r.token; sessionStorage.setItem('rmn_token', token);
    if (r.mfaRequired) { $('#lf').hidden = true; $('#mf').hidden = false; } else signedIn();
  } catch (err) { $('#lmsg').textContent = err.message; } };
$('#mf').onsubmit = async (e) => { e.preventDefault();
  try { await api('/v1/auth/mfa/verify', { method: 'POST', body: JSON.stringify({ code: $('#code').value }) }); signedIn(); } catch (err) { $('#lmsg').textContent = err.message; } };
$('#nav').onclick = (e) => { if (e.target.dataset.v) show(e.target.dataset.v); };
$('#view').onclick = async (e) => {
  const approve = e.target.dataset.approve, reject = e.target.dataset.reject;
  if (!approve && !reject) return;
  try {
    const q = await api('/v1/review/campaigns');
    const c = q.campaigns.find((x) => x.id === (approve || reject));
    const pending = c.creatives.filter((k) => k.status === 'PENDING_REVIEW');
    const note = approve ? (prompt('Approval note (min 5 characters):', 'Meets advertising policy') || '') : (prompt('Rejection reason shown to the advertiser:') || '');
    if (note.length < 5) return;
    await api(`/v1/review/campaigns/${c.id}/decision`, { method: 'POST', body: JSON.stringify({ decision: approve ? 'APPROVE' : 'REJECT', note,
      creatives: approve ? pending.map((k) => ({ creativeId: k.id, decision: 'APPROVE' })) : [] }) });
    show('review');
  } catch (err) { alert(err.message); }
};
$('#logout').onclick = async () => { await api('/v1/auth/logout', { method: 'POST', body: '{}' }).catch(() => {}); sessionStorage.removeItem('rmn_token'); location.reload(); };
if (token) api('/v1/me').then(signedIn).catch(() => sessionStorage.removeItem('rmn_token'));
</script>
</body>
</html>
