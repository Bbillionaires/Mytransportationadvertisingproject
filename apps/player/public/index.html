<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Ride Screen</title>
<link rel="stylesheet" href="player.css">
<script type="module" src="player.js"></script>
</head>
<body>
<div id="app">
  <header id="bar">
    <span class="brand">Ride Screen</span>
    <span id="now" class="now" aria-live="polite"></span>
    <span id="status" class="status" role="status"></span>
    <nav class="actions"><span id="rider"></span><button type="button" id="games" class="btn small">Games</button></nav>
  </header>
  <main id="stage">
    <video id="video" playsinline hidden></video>
    <img id="display" hidden alt="">
    <div id="idle" class="idle">Starting…</div>
    <div id="banner" class="banner" hidden></div>
    <div id="adui" class="adui" hidden></div>
    <button type="button" id="next" class="btn next" hidden aria-label="Next video">Next ›</button>
    <button type="button" id="tap" class="tap" hidden>Tap to start</button>
  </main>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="overlay-title"></div>
  <section id="setup" class="setup" hidden>
    <h1>Set up this screen</h1>
    <p>Ask your fleet administrator for a one-time enrollment code.</p>
    <form id="setup-form"><label for="code">Enrollment code</label><input id="code" autocomplete="off" required minlength="10"><button class="btn primary">Enroll</button></form>
    <p id="setup-msg" role="status"></p>
  </section>
  <footer class="foot"><span id="serial"></span></footer>
</div>
</body>
</html>
